function nextProductCode(name,excludeId){
 const clean=String(name||'Produto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
 const prefix=(clean.slice(0,3)||'PRO').padEnd(3,'X');
 const nums=(db.produtos||[]).filter(x=>String(x.id)!==String(excludeId||'')).map(x=>{const m=String(x.code||'').match(new RegExp('^'+prefix+'(\\d+)$'));return m?Number(m[1]):0});
 const next=(nums.length?Math.max(...nums):0)+1;
 return prefix+String(next).padStart(3,'0');
}

   obj.name=String(obj.name||'').trim();
   if(!obj.name){alert('Informe o nome do produto. Este campo é obrigatório.');return;}
   if(index<0)obj.code=nextProductCode(obj.name);else obj.code=db.produtos[index].code||nextProductCode(obj.name,db.produtos[index].id);
   obj.cost=r2(obj.cost);obj.price=r2(obj.price);
   obj.sizes=String(obj.sizes||'').split(',').map(x=>x.trim()).filter(Boolean).join(', ');
   obj.colors=String(obj.colors||'').split(',').map(x=>x.trim()).filter(Boolean).join(', ');
 }
 if(k==='orcamentos')obj.value=budgetTotal(obj.product,obj.qty);
 if(index<0){obj.id=(db[k]?.length?Math.max(...db[k].map(x=>Number(x.id)||0))+1:1);db[k].push(obj)}else db[k][index]={...db[k][index],...obj};
 reconcile(k,obj);save();closeModal();go(k)
}
function reconcile(k,o){
 if(k==='vendas'){o.total=r2(Number(o.qty||0)*(db.produtos.find(x=>String(x.id)===String(o.product))?.price||0));let ex=db.vendas.find(x=>x.id===o.id);if(!ex) db.estoque.find(x=>String(x.id)===String(o.product))&&(db.estoque.find(x=>String(x.id)===String(o.product)).out+=Number(o.qty||0))}
 if(k==='compras'){o.total=r2(Number(o.qty||0)*Number(o.unit||0));let s=db.estoque.find(x=>String(x.id)===String(o.product));if(s&&!db.compras.some(x=>x.id===o.id))s.in+=Number(o.qty||0)}
 if(k==='orcamentos')o.value=budgetTotal(o.product,o.qty);
 if(k==='folha')o.net=r2(Number(o.earnings||0)-Number(o.discount||0));
 if(k==='inventario')o.difference=Number(o.physical||0)-Number(o.system||0);
}
function del(k,i){let item=db[k][i];if(!confirm('Tem certeza que quer excluir este item?\n\nA exclusão é permanente e pode afetar os indicadores, saldos ou relacionamentos deste módulo.\n\nDeseja continuar?'))return;db[k].splice(i,1);save();go(k)}
ensureMoneyData();
window.addEventListener('error',e=>{document.getElementById('view').innerHTML='<div class="card"><h2>O sistema encontrou um erro</h2><p>'+String(e.message||e.error||'Erro inesperado')+'</p><button class="btn primary" onclick="localStorage.removeItem(KEY);location.reload()">Restaurar sistema</button></div>'}); initNav(); go('dashboard');
